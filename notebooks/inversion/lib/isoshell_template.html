<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isoshell Viewer</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000; color: #ccc; font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #header {
    height: 32px; padding: 0 16px; background: #0a0a0a; border-bottom: 1px solid #222;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #header h1 { font-size: 13px; color: #ddd; font-weight: 500; }
  #info-text { font-size: 11px; color: #888; }
  #main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #plot3d { flex: 7; min-height: 0; }
  #bottom-plots { flex: 4; min-height: 0; display: flex; flex-direction: column; }
  #lc-plot { flex: 1; min-height: 0; border-top: 1px solid #222; }
  #ipl-plot { flex: 1; min-height: 0; border-top: 1px solid #181818; }
  #ang-plot { flex: 1; min-height: 0; border-top: 1px solid #181818; }
  #controls {
    background: #0a0a0a; border-top: 1px solid #222;
    display: flex; align-items: center; padding: 4px 12px; gap: 8px;
    flex-wrap: wrap; flex-shrink: 0;
  }
  .ctrl-group { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .ctrl-label { font-size: 11px; color: #999; }
  .ctrl-val { font-size: 11px; color: #5dade2; min-width: 28px; text-align: right; }
  .ctrl-group input[type=range] { accent-color: #5dade2; cursor: pointer; }
  .ctrl-group select {
    background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 3px;
    padding: 2px 6px; font-size: 11px; cursor: pointer;
  }
  .ctrl-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #999; cursor: pointer; }
  .ctrl-toggle input { accent-color: #5dade2; cursor: pointer; }
  .sep { width: 1px; height: 20px; background: #333; flex-shrink: 0; }
  .btn {
    background: #1a1a1a; color: #ccc; border: 1px solid #444; border-radius: 3px;
    padding: 2px 10px; font-size: 11px; cursor: pointer;
  }
  .btn:hover { background: #2a2a2a; }
  .btn.active { background: #1a3a5a; border-color: #5dade2; color: #5dade2; }
  .kbd { font-size: 10px; color: #444; }
</style>
</head>
<body>

<div id="header">
  <h1 id="title">Isoshell Viewer</h1>
  <span id="info-text"></span>
</div>
<div id="main">
  <div id="plot3d"></div>
  <div id="bottom-plots">
    <div id="lc-plot"></div>
    <div id="ipl-plot"></div>
    <div id="ang-plot"></div>
  </div>
</div>
<div id="controls">
  <button class="btn" id="play-btn" onclick="togglePlay()">&#9654; Play</button>
  <div class="ctrl-group">
    <span class="ctrl-label">Epoch:</span>
    <button class="btn" onclick="stepEpoch(-1)">−</button>
    <input type="range" id="epoch-slider" min="0" max="499" value="0" step="1" style="width:220px">
    <button class="btn" onclick="stepEpoch(1)">+</button>
    <span class="ctrl-val" id="epoch-val">0</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Speed:</span>
    <select id="speed-select">
      <option value="200">Slow</option>
      <option value="80" selected>Normal</option>
      <option value="30">Fast</option>
    </select>
  </div>
  <div class="sep"></div>
  <span id="art-sliders"></span>
  <div class="sep"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">Detail:</span>
    <select id="subdiv-select">
      <option value="5">Ultra</option>
      <option value="6" selected>Ultra 2x</option>
    </select>
  </div>
  <div class="sep"></div>
  <label class="ctrl-toggle">
    <input type="checkbox" id="normals-check" checked onchange="toggleNormals()"> Normals
  </label>
  <label class="ctrl-toggle">
    <input type="checkbox" id="trail-check" checked onchange="updateEpoch()"> Trail
  </label>
  <label class="ctrl-toggle">
    <input type="checkbox" id="lofi-check" onchange="updateLCPlot()"> Lo-fi
  </label>
  <div class="sep"></div>
  <span class="kbd">Space: play &middot; ←→: step &middot; N: normals &middot; T: trail</span>
</div>

<script>
const D = __SURFACE_DATA__;
const T = D.trajectory;
const PI = Math.PI, DEG = PI / 180;

// ── Vector math ──
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function vlen(a){return Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]);}
function normalize(a){const l=vlen(a);return l>1e-10?[a[0]/l,a[1]/l,a[2]/l]:[0,0,0];}
function rotateAroundAxis(v,axis,angle){
  const c=Math.cos(angle),s=Math.sin(angle),d=dot(axis,v),cr=cross(axis,v);
  return[v[0]*c+cr[0]*s+axis[0]*d*(1-c),v[1]*c+cr[1]*s+axis[1]*d*(1-c),v[2]*c+cr[2]*s+axis[2]*d*(1-c)];
}

// ── Icosphere ──
function generateIcosphere(sub){
  const t=(1+Math.sqrt(5))/2;
  let V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(normalize);
  let F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  for(let s=0;s<sub;s++){const mc={},nf=[];function gm(a,b){const k=Math.min(a,b)+'_'+Math.max(a,b);if(mc[k]!==undefined)return mc[k];V.push(normalize([(V[a][0]+V[b][0])/2,(V[a][1]+V[b][1])/2,(V[a][2]+V[b][2])/2]));mc[k]=V.length-1;return mc[k];}for(const f of F){const a=gm(f[0],f[1]),b=gm(f[1],f[2]),c=gm(f[2],f[0]);nf.push([f[0],a,c],[f[1],b,a],[f[2],c,b],[a,b,c]);}F=nf;}
  return{verts:V,faces:F,N:V.length,F:F.length};
}

// ── BRDF ──
function computeBRDF(nk1,nk2,hk1,nh,r_d,r_s,n_p){
  const a=1-nk1/2,b=1-nk2/2;
  const fr=r_s+(1-r_s)*Math.pow(1-hk1,5);
  const rd=(28*r_d/(23*PI))*(1-r_s)*(1-Math.pow(a,5))*(1-Math.pow(b,5));
  const dn=hk1*Math.max(nk1,nk2);
  let rs=0;if(dn>1e-10)rs=((n_p+1)/(8*PI))*Math.pow(nh,n_p)/dn*fr;
  return rd+rs;
}

// ── BRDF state ──
let useDefaultBrdf = true;
const brdfOverrides = {}, brdfDefaults = {};
for(const bd of D.brdfDefaults)for(const cn of bd.components){
  brdfDefaults[cn]={r_d:bd.r_d,r_s:bd.r_s,n_phong:bd.n_phong};
  brdfOverrides[cn]={r_d:bd.r_d,r_s:bd.r_s,n_phong:bd.n_phong};
}
function getBrdf(cn){return useDefaultBrdf?brdfDefaults[cn]:brdfOverrides[cn];}

// ── Build active groups ──
const sliderAngles={};
for(const c of D.components)sliderAngles[c.name]=0;
function buildActiveGroups(){
  const groups=[];
  for(const comp of D.components){
    const ang=sliderAngles[comp.name]||0;
    const rot=comp.articulation&&Math.abs(ang)>1e-6;
    const axis=comp.articulation?comp.articulation.axis:null;
    const rad=ang*DEG;
    const b=getBrdf(comp.name);
    for(const g of comp.groups){
      let n=g.normal; if(rot)n=rotateAroundAxis(n,axis,rad);
      groups.push({normal:n,area:g.area,r_d:b.r_d,r_s:b.r_s,n_phong:b.n_phong,comp:comp.name});
    }
  }
  return groups;
}

// ── Compute flux at a direction ──
function computeFlux(d,groups){
  let flux=0;
  for(let i=0;i<groups.length;i++){
    const g=groups[i],nd=dot(g.normal,d);
    if(nd<=0)continue;
    flux+=computeBRDF(nd,nd,1,nd,g.r_d,g.r_s,g.n_phong)*g.area*nd*nd;
  }
  return flux;
}

// ── Compute surface ──
const R_MAX=1.0, R_MIN=0.1;
let absoluteMode=false, refRange=null;

function computeSurface(mesh,groups){
  const N=mesh.N;
  const fluxArr=new Float64Array(N),logFlux=new Float64Array(N);
  for(let i=0;i<N;i++){fluxArr[i]=computeFlux(mesh.verts[i],groups);logFlux[i]=fluxArr[i]>0?Math.log10(fluxArr[i]):NaN;}
  let logMin=Infinity,logMax=-Infinity;
  for(let i=0;i<N;i++){if(!isNaN(logFlux[i])){if(logFlux[i]<logMin)logMin=logFlux[i];if(logFlux[i]>logMax)logMax=logFlux[i];}}
  const mMin=(absoluteMode&&refRange)?refRange.logMin:logMin;
  const mMax=(absoluteMode&&refRange)?refRange.logMax:logMax;
  const span=mMax-mMin;
  const x=new Float64Array(N),y=new Float64Array(N),z=new Float64Array(N);
  for(let i=0;i<N;i++){
    if(isNaN(logFlux[i])){x[i]=0;y[i]=0;z[i]=0;}
    else{let t=span>1e-10?(logFlux[i]-mMin)/span:1;t=Math.max(0,Math.min(1,t));const r=R_MIN+t*(R_MAX-R_MIN);x[i]=mesh.verts[i][0]*r;y[i]=mesh.verts[i][1]*r;z[i]=mesh.verts[i][2]*r;}
  }
  const F=mesh.F,fi=new Float64Array(F);
  for(let f=0;f<F;f++){const fc=mesh.faces[f];const a=logFlux[fc[0]],b=logFlux[fc[1]],c=logFlux[fc[2]];fi[f]=(isNaN(a)||isNaN(b)||isNaN(c))?NaN:(a+b+c)/3;}
  return{x,y,z,fluxArr,logFlux,logMin,logMax,faceIntensity:fi,mMin,mMax,span};
}

// ── Marching triangles: extract isoshell contour as separate loops ──
function extractContourLoops(mesh, fluxArr, targetFlux, logMin, logMax, span) {
  const logTarget = targetFlux > 0 ? Math.log10(targetFlux) : NaN;
  if (isNaN(logTarget)) return [];

  // Surface radius for this brightness level
  let tNorm = span > 1e-10 ? (logTarget - logMin) / span : 1;
  tNorm = Math.max(0, Math.min(1, tNorm));
  const r = R_MIN + tNorm * (R_MAX - R_MIN);

  // Step 1: extract edge-crossing segments from each face
  const segments = [];  // each: [[x,y,z],[x,y,z]]
  for (let fi = 0; fi < mesh.faces.length; fi++) {
    const face = mesh.faces[fi];
    const v = [mesh.verts[face[0]], mesh.verts[face[1]], mesh.verts[face[2]]];
    const lf = [fluxArr[face[0]], fluxArr[face[1]], fluxArr[face[2]]].map(
      x => x > 0 ? Math.log10(x) : NaN);

    const crossings = [];
    for (let e = 0; e < 3; e++) {
      const i0 = e, i1 = (e + 1) % 3;
      if (isNaN(lf[i0]) || isNaN(lf[i1])) continue;
      const d0 = lf[i0] - logTarget, d1 = lf[i1] - logTarget;
      if (d0 * d1 < 0) {
        const t = d0 / (d0 - d1);
        const dir = [
          v[i0][0] + t * (v[i1][0] - v[i0][0]),
          v[i0][1] + t * (v[i1][1] - v[i0][1]),
          v[i0][2] + t * (v[i1][2] - v[i0][2]),
        ];
        const len = Math.sqrt(dir[0]*dir[0]+dir[1]*dir[1]+dir[2]*dir[2]);
        if (len > 1e-10) { dir[0]/=len; dir[1]/=len; dir[2]/=len; }
        crossings.push([dir[0]*r, dir[1]*r, dir[2]*r]);
      }
    }
    if (crossings.length === 2) segments.push(crossings);
  }

  if (segments.length === 0) return [];

  // Step 2: chain segments into closed loops via spatial hashing
  const tol = 1e-4;
  const pk = (p) => (Math.round(p[0]/tol) + ',' + Math.round(p[1]/tol) + ',' + Math.round(p[2]/tol));

  // Build adjacency: endpoint key -> list of {seg, end}
  const adj = {};
  for (let i = 0; i < segments.length; i++) {
    for (let e = 0; e < 2; e++) {
      const k = pk(segments[i][e]);
      if (!adj[k]) adj[k] = [];
      adj[k].push({seg: i, end: e});
    }
  }

  const used = new Uint8Array(segments.length);
  const loops = [];

  for (let si = 0; si < segments.length; si++) {
    if (used[si]) continue;
    used[si] = 1;
    const chain = [segments[si][0], segments[si][1]];

    // Extend from the tail
    for (;;) {
      const k = pk(chain[chain.length - 1]);
      const nb = adj[k];
      if (!nb) break;
      let found = false;
      for (const n of nb) {
        if (used[n.seg]) continue;
        used[n.seg] = 1;
        chain.push(segments[n.seg][n.end === 0 ? 1 : 0]);
        found = true;
        break;
      }
      if (!found) break;
    }
    // Extend from the head
    for (;;) {
      const k = pk(chain[0]);
      const nb = adj[k];
      if (!nb) break;
      let found = false;
      for (const n of nb) {
        if (used[n.seg]) continue;
        used[n.seg] = 1;
        chain.unshift(segments[n.seg][n.end === 0 ? 1 : 0]);
        found = true;
        break;
      }
      if (!found) break;
    }

    // Close the loop if endpoints match
    if (chain.length > 2) {
      const d = Math.abs(chain[0][0]-chain[chain.length-1][0]) +
                Math.abs(chain[0][1]-chain[chain.length-1][1]) +
                Math.abs(chain[0][2]-chain[chain.length-1][2]);
      if (d < tol * 3) chain.push(chain[0]);
    }

    if (chain.length >= 3) loops.push(chain);
  }

  return loops;  // array of loops, each loop is array of [x,y,z] points
}

// Flatten a single loop into Plotly x/y/z arrays
function loopToXYZ(loop) {
  const x=[], y=[], z=[];
  for (const p of loop) { x.push(p[0]); y.push(p[1]); z.push(p[2]); }
  return {x, y, z};
}

// Flatten multiple loops into one Plotly trace with NaN separators
function loopsToXYZ(loops) {
  const x=[], y=[], z=[];
  for (const loop of loops) {
    for (const p of loop) { x.push(p[0]); y.push(p[1]); z.push(p[2]); }
    x.push(NaN); y.push(NaN); z.push(NaN);
  }
  return {x, y, z};
}

// Find which loop a point is closest to (by min distance to any segment)
function findClosestLoop(loops, pt) {
  let bestLoop = -1, bestDist = Infinity;
  for (let li = 0; li < loops.length; li++) {
    const loop = loops[li];
    for (let i = 0; i < loop.length; i++) {
      const dx = loop[i][0]-pt[0], dy = loop[i][1]-pt[1], dz = loop[i][2]-pt[2];
      const d = dx*dx + dy*dy + dz*dz;
      if (d < bestDist) { bestDist = d; bestLoop = li; }
    }
  }
  return bestLoop;
}

// ── State ──
let currentSubdiv = 6, meshCache = {}, currentEpoch = 0, playing = false, playTimer = null;
let surfaceResult = null, activeGroups = null;
function getMesh(s) { if (!meshCache[s]) meshCache[s] = generateIcosphere(s); return meshCache[s]; }

// Trace indices in the 3D plot
const TRAIL_LENGTH = 30;   // epochs of trail to show
const TRAIL_SEGMENTS = 8;  // number of opacity bands
const COL_DOT = '#ffffff';          // PAB dot: white
const COL_ACTIVE = '#00e5ff';       // active loop + trail: cyan
const COL_INACTIVE = '#ff8800';     // inactive loops: orange
const TRACE = { surface: 0, contourActive: -1, contourInactive: -1, pabDot: -1, pabTrailStart: -1, pabTrailEnd: -1, normalStart: -1, normalCount: 0 };

// ── Normal arrow helpers ──
const SHAFT = 1.15, CONE_SZ = 0.1;
const GROUP_PALETTE = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6','#bfef45','#fabed4','#469990'];
function isPositive(n){for(let i=0;i<3;i++){if(Math.abs(n[i])>0.001)return n[i]>0;}return true;}
function canonKey(n){const p=isPositive(n);const s=p?n:n.map(v=>-v);return s.map(v=>v.toFixed(3)).join(',');}
function groupNormals(groups){
  const keys=[],normals=[],areas=[],compSets=[];
  for(const g of groups){
    const key=g.normal.map(v=>v.toFixed(3)).join(',');
    const idx=keys.indexOf(key);
    if(idx===-1){keys.push(key);normals.push(g.normal);areas.push(g.area);compSets.push(new Set([g.comp]));}
    else{areas[idx]+=g.area;compSets[idx].add(g.comp);}
  }
  return normals.map((n,i)=>({normal:n,area:areas[i],comps:[...compSets[i]]}));
}

// ── Build all 3D traces ──
function buildAllTraces() {
  activeGroups = buildActiveGroups();
  const mesh = getMesh(currentSubdiv);
  surfaceResult = computeSurface(mesh, activeGroups);

  const iArr=[],jArr=[],kArr=[];
  for(const f of mesh.faces){iArr.push(f[0]);jArr.push(f[1]);kArr.push(f[2]);}

  const traces = [];

  // Trace 0: Surface mesh
  traces.push({
    type:'mesh3d',
    x:Array.from(surfaceResult.x),y:Array.from(surfaceResult.y),z:Array.from(surfaceResult.z),
    i:iArr,j:jArr,k:kArr,
    intensity:Array.from(surfaceResult.faceIntensity),
    intensitymode:'cell',colorscale:[[0,'#000000'],[0.5,'#666666'],[1,'#ffffff']],showscale:false,
    flatshading:true,lighting:{ambient:0.7,diffuse:0.4,specular:0.1,fresnel:0},
    lightposition:{x:0,y:0,z:10000},opacity:1.0,
    hovertemplate:'log\u2081\u2080(flux): %{intensity:.2f}<extra></extra>',
    name:'pab-c',showlegend:false,
  });
  TRACE.surface = 0;

  // Trace 1: Active isoshell loop (the one the PAB is on)
  traces.push({
    type:'scatter3d',mode:'lines',
    x:[],y:[],z:[],
    line:{color:COL_ACTIVE,width:8},
    name:'Active loop',showlegend:false,hoverinfo:'none',
  });
  TRACE.contourActive = 1;

  // Trace 2: Inactive isoshell loops
  traces.push({
    type:'scatter3d',mode:'lines',
    x:[],y:[],z:[],
    line:{color:COL_INACTIVE,width:5},
    name:'Other loops',showlegend:false,hoverinfo:'none',
  });
  TRACE.contourInactive = 2;

  // Trace 3: PAB dot (current epoch)
  traces.push({
    type:'scatter3d',mode:'markers',
    x:[0],y:[0],z:[0],
    marker:{size:8,color:COL_DOT,symbol:'circle',line:{color:COL_ACTIVE,width:2}},
    name:'PAB',showlegend:false,
    hovertemplate:'PAB (ep %{text})<extra></extra>',text:['0'],
  });
  TRACE.pabDot = 3;

  // Traces 4..4+TRAIL_SEGMENTS-1: PAB trail segments (opacity gradient)
  TRACE.pabTrailStart = 4;
  for (let s = 0; s < TRAIL_SEGMENTS; s++) {
    const opacity = 0.15 + 0.85 * (s / (TRAIL_SEGMENTS - 1));
    traces.push({
      type:'scatter3d',mode:'lines',
      x:[],y:[],z:[],
      line:{color:COL_ACTIVE,width:4},opacity:opacity,
      name:'Trail',showlegend:false,hoverinfo:'none',
    });
  }
  TRACE.pabTrailEnd = 4 + TRAIL_SEGMENTS;

  // Trace: centroid dots (active centroid = cyan, inactive = orange)
  TRACE.centroidActive = traces.length;
  traces.push({
    type:'scatter3d',mode:'markers',
    x:[],y:[],z:[],
    marker:{size:5,color:COL_ACTIVE,symbol:'diamond'},
    name:'Active centroid',showlegend:false,hoverinfo:'none',
  });
  TRACE.centroidInactive = traces.length;
  traces.push({
    type:'scatter3d',mode:'markers',
    x:[],y:[],z:[],
    marker:{size:4,color:COL_INACTIVE,symbol:'diamond'},
    name:'Other centroids',showlegend:false,hoverinfo:'none',
  });

  // Trace: angle arc from PAB to active centroid
  TRACE.angleArc = traces.length;
  traces.push({
    type:'scatter3d',mode:'lines+text',
    x:[],y:[],z:[],
    line:{color:COL_DOT,width:3,dash:'dash'},
    text:[],textposition:'middle center',textfont:{size:12,color:COL_DOT},
    name:'Angle',showlegend:false,hoverinfo:'none',
  });

  // Normal arrows (start after all dynamic traces)
  TRACE.normalStart = traces.length;
  const AREA_THRESH = 2.0;
  const gn = groupNormals(activeGroups);
  const pairMap = {};
  let nextColor = 0;
  const pairInfo = new Array(gn.length);
  for (let i=0;i<gn.length;i++){
    const ck=canonKey(gn[i].normal);
    if(!pairMap[ck])pairMap[ck]={colorIdx:nextColor++};
    pairInfo[i]={colorIdx:pairMap[ck].colorIdx,pos:isPositive(gn[i].normal)};
  }
  for (let i=0;i<gn.length;i++){
    const g=gn[i],n=g.normal,pi=pairInfo[i];
    const col=GROUP_PALETTE[pi.colorIdx%GROUP_PALETTE.length];
    const primary=g.area>AREA_THRESH;
    const w=primary?3:1.5;
    const dash=pi.pos?'solid':'dash';
    traces.push({type:'scatter3d',mode:'lines',x:[0,n[0]*SHAFT],y:[0,n[1]*SHAFT],z:[0,n[2]*SHAFT],line:{color:col,width:w,dash:dash},showlegend:false,hoverinfo:'none'});
    traces.push({type:'cone',anchor:'tail',x:[n[0]*SHAFT],y:[n[1]*SHAFT],z:[n[2]*SHAFT],u:[n[0]],v:[n[1]],w:[n[2]],sizemode:'absolute',sizeref:primary?CONE_SZ:CONE_SZ*0.6,colorscale:[[0,col],[1,col]],showscale:false,showlegend:false,hoverinfo:'none'});
  }
  TRACE.normalCount = traces.length - TRACE.normalStart;

  return traces;
}

// ── Map a PAB direction to its position on the surface (for the dot/trail) ──
function pabToSurface(pabDir) {
  const flux = computeFlux(pabDir, activeGroups);
  if (flux <= 0) return [pabDir[0]*R_MIN, pabDir[1]*R_MIN, pabDir[2]*R_MIN];
  const logF = Math.log10(flux);
  let t = surfaceResult.span > 1e-10 ? (logF - surfaceResult.mMin) / surfaceResult.span : 1;
  t = Math.max(0, Math.min(1, t));
  const r = R_MIN + t * (R_MAX - R_MIN);
  return [pabDir[0]*r, pabDir[1]*r, pabDir[2]*r];
}

// ── Compute total IPL set length for a set of loops ──
function totalLoopLength(loops) {
  let total = 0;
  for (const loop of loops) {
    for (let i = 1; i < loop.length; i++) {
      const dx = loop[i][0]-loop[i-1][0], dy = loop[i][1]-loop[i-1][1], dz = loop[i][2]-loop[i-1][2];
      total += Math.sqrt(dx*dx + dy*dy + dz*dz);
    }
  }
  return total;
}

// ── Compute centroid of a loop (on the unit sphere, then projected to surface radius) ──
function loopCentroidDir(loop) {
  // Average the unit-sphere directions of all points in the loop
  let sx=0, sy=0, sz=0;
  for (const p of loop) {
    const len = Math.sqrt(p[0]*p[0]+p[1]*p[1]+p[2]*p[2]);
    if (len > 1e-10) { sx += p[0]/len; sy += p[1]/len; sz += p[2]/len; }
  }
  const len = Math.sqrt(sx*sx+sy*sy+sz*sz);
  if (len < 1e-10) return [0,0,1];
  return [sx/len, sy/len, sz/len];
}

// Angular distance in degrees between two unit vectors
function angDistDeg(a, b) {
  const d = a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  return Math.acos(Math.max(-1, Math.min(1, d))) * 180 / PI;
}

// ── IPL data from Python precomputation ──
const IPL = D.iplData || null;
const iplLengths = IPL ? new Float64Array(IPL.ipl_lengths) : null;
const iplLoopCounts = IPL ? new Int32Array(IPL.ipl_loop_counts) : null;
const iplLoopLengths = IPL ? IPL.ipl_loop_lengths : null;      // [[float]] per epoch
const iplAngDist = IPL ? new Float64Array(IPL.ipl_ang_dist.map(v => v === null ? NaN : v)) : null;
const iplCentroids = IPL ? IPL.ipl_centroids : null;            // [[{dir, isActive}]] per epoch
const iplActiveCentroidDir = IPL ? IPL.ipl_active_centroid_dir : null;  // [[x,y,z]|null] per epoch
const iplMinima = IPL ? IPL.ipl_minima : [];

// ── IPL length plot ──
let iplCursorIdx = 0;

function buildIPLPlot() {
  if (!iplLengths) return;
  const epochs = Array.from({length: T.n_obs}, (_, i) => i);
  const counts = Array.from(iplLoopCounts);
  const maxCount = Math.max(...counts);
  const traces = [];

  // Thin grey line underneath for continuity
  traces.push({
    x: epochs, y: Array.from(iplLengths),
    type: 'scatter', mode: 'lines',
    line: { color: '#333', width: 1 },
    name: 'IPL set length', hoverinfo: 'skip',
  });

  // Colour-coded markers by loop count: buckets 1-2, 3-4, >4
  const COL_BUCKET = ['#00e5ff','#ff8800','#ff2222'];
  const bucketColors = counts.map(c => c <= 2 ? COL_BUCKET[0] : c <= 4 ? COL_BUCKET[1] : COL_BUCKET[2]);
  traces.push({
    x: epochs, y: Array.from(iplLengths),
    type: 'scatter', mode: 'markers',
    marker: { size: 3, color: bucketColors },
    name: 'IPL set length',
    hovertemplate: 'ep %{x}: length=%{y:.2f}, loops=%{text}<extra></extra>',
    text: counts.map(String),
  });

  // Mark minima
  if (iplMinima && iplMinima.length > 0) {
    traces.push({
      x: iplMinima.map(m => m.ep),
      y: iplMinima.map(m => iplLengths[m.ep]),
      type: 'scatter', mode: 'markers',
      marker: { size: 7, color: COL_ACTIVE, symbol: 'triangle-down', line:{color:'#fff',width:1} },
      name: 'Minima',
    });
  }

  // Cursor
  const yMax = Math.max(...iplLengths) * 1.05;
  traces.push({
    x: [currentEpoch, currentEpoch], y: [0, yMax],
    type: 'scatter', mode: 'lines',
    line: { color: COL_ACTIVE, width: 2 },
    name: 'Cursor', showlegend: false,
  });
  iplCursorIdx = traces.length - 1;

  const layout = {
    paper_bgcolor: '#000', plot_bgcolor: '#0a0a0a',
    font: { color: '#aaa', size: 10 },
    xaxis: { title: '', color: '#666', gridcolor: '#1a1a1a', range: [0, T.n_obs-1] },
    yaxis: { title: 'IPL Set Length', color: '#666', gridcolor: '#1a1a1a' },
    margin: { l: 50, r: 50, t: 5, b: 15 },
    showlegend: false, hovermode: 'x unified',
  };

  Plotly.newPlot('ipl-plot', traces, layout, { responsive: true, displayModeBar: false });
  document.getElementById('ipl-plot').on('plotly_click', function(data) {
    if (data.points && data.points.length > 0) {
      const ep = Math.round(data.points[0].x);
      if (ep >= 0 && ep < T.n_obs) { currentEpoch = ep; document.getElementById('epoch-slider').value = ep; updateEpoch(); }
    }
  });
}

// ── Angular distance plot (PAB ↔ centroid of active IPL) ──
let angCursorIdx = 0;

function buildAngPlot() {
  if (!iplAngDist) return;
  const epochs = Array.from({length: T.n_obs}, (_, i) => i);
  const traces = [];

  traces.push({
    x: epochs, y: Array.from(iplAngDist),
    type: 'scatter', mode: 'lines',
    line: { color: COL_ACTIVE, width: 1 },
    name: 'PAB↔centroid °',
  });

  // Mark minima
  if (iplMinima && iplMinima.length > 0) {
    traces.push({
      x: iplMinima.map(m => m.ep),
      y: iplMinima.map(m => m.angDist),
      type: 'scatter', mode: 'markers',
      marker: { size: 6, color: COL_ACTIVE, symbol: 'triangle-down' },
      name: 'Minima',
    });
  }

  const yMax = Math.max(...iplAngDist.filter(v => !isNaN(v))) * 1.05 || 90;
  traces.push({
    x: [currentEpoch, currentEpoch], y: [0, yMax],
    type: 'scatter', mode: 'lines',
    line: { color: COL_ACTIVE, width: 2 },
    name: 'Cursor', showlegend: false,
  });
  angCursorIdx = traces.length - 1;

  const layout = {
    paper_bgcolor: '#000', plot_bgcolor: '#0a0a0a',
    font: { color: '#aaa', size: 10 },
    xaxis: { title: 'Epoch', color: '#666', gridcolor: '#1a1a1a', range: [0, T.n_obs-1] },
    yaxis: { title: 'PAB↔Centroid (°)', color: '#666', gridcolor: '#1a1a1a' },
    margin: { l: 50, r: 10, t: 5, b: 30 },
    showlegend: false, hovermode: 'x unified',
  };

  Plotly.newPlot('ang-plot', traces, layout, { responsive: true, displayModeBar: false });
  document.getElementById('ang-plot').on('plotly_click', function(data) {
    if (data.points && data.points.length > 0) {
      const ep = Math.round(data.points[0].x);
      if (ep >= 0 && ep < T.n_obs) { currentEpoch = ep; document.getElementById('epoch-slider').value = ep; updateEpoch(); }
    }
  });
}

// ── Update epoch (isoshell loops + PAB + trail + LC cursor) ──
function updateEpoch() {
  const ep = currentEpoch;
  const mesh = getMesh(currentSubdiv);
  const pab = T.pab_body[ep];

  // Compute the surface flux at the true PAB direction → isoshell target
  const targetFlux = computeFlux(pab, activeGroups);

  // Extract contour as separate loops
  const loops = extractContourLoops(mesh, surfaceResult.fluxArr, targetFlux,
    surfaceResult.mMin, surfaceResult.mMax, surfaceResult.span);

  // PAB dot position on the surface
  const pabPos = pabToSurface(pab);

  // Find which loop the PAB belongs to
  const activeIdx = findClosestLoop(loops, pabPos);

  // Split loops into active (PAB's loop) and inactive (everything else)
  const activeLoop = activeIdx >= 0 ? loopToXYZ(loops[activeIdx]) : {x:[],y:[],z:[]};
  const inactiveLoops = loops.filter((_, i) => i !== activeIdx);
  const inactive = loopsToXYZ(inactiveLoops);

  // PAB trail — split into TRAIL_SEGMENTS bands with fading opacity
  const showTrail = document.getElementById('trail-check').checked;
  const trailData = [];
  for (let s = 0; s < TRAIL_SEGMENTS; s++) trailData.push({x:[],y:[],z:[]});

  if (showTrail && ep > 0) {
    const start = Math.max(0, ep - TRAIL_LENGTH);
    const trailLen = ep - start;
    for (let i = start; i <= ep; i++) {
      const p = pabToSurface(T.pab_body[i]);
      const frac = trailLen > 0 ? (i - start) / trailLen : 1;
      const seg = Math.min(Math.floor(frac * TRAIL_SEGMENTS), TRAIL_SEGMENTS - 1);
      trailData[seg].x.push(p[0]); trailData[seg].y.push(p[1]); trailData[seg].z.push(p[2]);
    }
  }

  // Centroid dots + angle arc (using precomputed per-epoch centroid data)
  const acX=[], acY=[], acZ=[];  // active centroids
  const icX=[], icY=[], icZ=[];  // inactive centroids
  let arcX=[], arcY=[], arcZ=[], arcText=[];

  // Check if current epoch is near a local minimum (within 1 epoch)
  let atMinimum = null;
  if (iplMinima) {
    for (const m of iplMinima) {
      if (Math.abs(ep - m.ep) <= 1) { atMinimum = m; break; }
    }
  }

  // Show centroids from precomputed per-epoch data
  if (iplCentroids && iplCentroids[ep]) {
    for (const c of iplCentroids[ep]) {
      // Project centroid dir to surface position
      const cSurf = pabToSurface(c.dir);
      if (c.isActive) {
        acX.push(cSurf[0]); acY.push(cSurf[1]); acZ.push(cSurf[2]);
        // Angle arc from PAB to active centroid
        if (atMinimum) {
          arcX = [pabPos[0], cSurf[0]];
          arcY = [pabPos[1], cSurf[1]];
          arcZ = [pabPos[2], cSurf[2]];
          const ad = !isNaN(iplAngDist[ep]) ? iplAngDist[ep].toFixed(1) + '°' : '';
          arcText = ['', ad];
        }
      } else {
        icX.push(cSurf[0]); icY.push(cSurf[1]); icZ.push(cSurf[2]);
      }
    }
  }

  // Batch ALL 3D updates into one restyle
  const allIndices = [TRACE.contourActive, TRACE.contourInactive, TRACE.pabDot,
                      TRACE.centroidActive, TRACE.centroidInactive, TRACE.angleArc];
  const allX = [activeLoop.x, inactive.x, [pabPos[0]], acX, icX, arcX];
  const allY = [activeLoop.y, inactive.y, [pabPos[1]], acY, icY, arcY];
  const allZ = [activeLoop.z, inactive.z, [pabPos[2]], acZ, icZ, arcZ];
  const allText = [undefined, undefined, [`${ep}`], undefined, undefined, arcText];

  for (let s = 0; s < TRAIL_SEGMENTS; s++) {
    allIndices.push(TRACE.pabTrailStart + s);
    allX.push(trailData[s].x);
    allY.push(trailData[s].y);
    allZ.push(trailData[s].z);
    allText.push(undefined);
  }

  Plotly.restyle('plot3d', { x: allX, y: allY, z: allZ, text: allText }, allIndices);

  // LC + IPL + Ang cursors
  Plotly.restyle('lc-plot', { x: [[ep, ep]], y: [[2, 16]] }, [lcCursorIdx]);
  if (iplLengths) {
    Plotly.restyle('ipl-plot', { x: [[ep, ep]], y: [[0, Math.max(...iplLengths)*1.05]] }, [iplCursorIdx]);
  }
  if (iplAngDist) {
    const yMax = Math.max(...Array.from(iplAngDist).filter(v => !isNaN(v))) * 1.05 || 90;
    Plotly.restyle('ang-plot', { x: [[ep, ep]], y: [[0, yMax]] }, [angCursorIdx]);
  }

  updateInfoText();
}

function updateInfoText() {
  const ep = currentEpoch;
  const pab = T.pab_body[ep];
  const targetFlux = computeFlux(pab, activeGroups);
  const mag = T.mag_hifi[ep];
  const logF = targetFlux > 0 ? Math.log10(targetFlux).toFixed(2) : '--';
  document.getElementById('info-text').textContent =
    `Epoch ${ep} | mag ${mag.toFixed(2)} | log\u2081\u2080(flux) ${logF} | ` +
    `|ω|=${T.omega_mag_dps.toFixed(3)} °/s | Seed ${T.seed}`;
  document.getElementById('epoch-val').textContent = ep;
}

// ── Light curve plot ──
let lcCursorIdx = 0;
function buildLCPlot() {
  const epochs = Array.from({length: T.n_obs}, (_, i) => i);
  const showLofi = document.getElementById('lofi-check').checked;

  const traces = [];

  // Hi-fi light curve
  traces.push({
    x: epochs, y: T.mag_hifi,
    type: 'scatter', mode: 'lines',
    line: { color: '#5dade2', width: 1 },
    name: 'Hi-fi',
  });

  // Lo-fi (optional)
  if (showLofi) {
    traces.push({
      x: epochs, y: T.mag_lofi,
      type: 'scatter', mode: 'lines',
      line: { color: '#888', width: 1, dash: 'dot' },
      name: 'Lo-fi',
    });
  }

  // Peak markers
  traces.push({
    x: T.peak_epochs, y: T.peak_epochs.map(e => T.mag_hifi[e]),
    type: 'scatter', mode: 'markers',
    marker: { size: 4, color: '#ff8800', symbol: 'triangle-down' },
    name: 'Peaks',
  });

  // Epoch cursor (vertical line)
  traces.push({
    x: [currentEpoch, currentEpoch], y: [2, 16],
    type: 'scatter', mode: 'lines',
    line: { color: '#00e5ff', width: 2 },
    name: 'Cursor', showlegend: false,
  });
  lcCursorIdx = traces.length - 1;

  const layout = {
    paper_bgcolor: '#000', plot_bgcolor: '#0a0a0a',
    font: { color: '#aaa', size: 10 },
    xaxis: { title: 'Epoch', color: '#666', gridcolor: '#1a1a1a', range: [0, T.n_obs-1] },
    yaxis: { title: 'Magnitude', color: '#666', gridcolor: '#1a1a1a', autorange: 'reversed' },
    margin: { l: 50, r: 10, t: 5, b: 30 },
    showlegend: false,
    hovermode: 'x unified',
  };

  Plotly.newPlot('lc-plot', traces, layout, { responsive: true, displayModeBar: false });

  // Click on LC to jump to epoch
  document.getElementById('lc-plot').on('plotly_click', function(data) {
    if (data.points && data.points.length > 0) {
      const ep = Math.round(data.points[0].x);
      if (ep >= 0 && ep < T.n_obs) {
        currentEpoch = ep;
        document.getElementById('epoch-slider').value = ep;
        updateEpoch();
      }
    }
  });
}

function updateLCPlot() {
  buildLCPlot();
}

// ── 3D layout ──
function build3DLayout() {
  const sd = { showbackground: true, backgroundcolor: '#050505', gridcolor: '#181818',
               zerolinecolor: '#252525', showticklabels: false, title: '' };
  return {
    scene: {
      xaxis: Object.assign({}, sd, {range:[-1.4,1.4]}),
      yaxis: Object.assign({}, sd, {range:[-1.4,1.4]}),
      zaxis: Object.assign({}, sd, {range:[-1.4,1.4]}),
      aspectmode: 'cube',
      camera: { eye: {x:1.6,y:1.6,z:1.0} },
    },
    paper_bgcolor: '#000', plot_bgcolor: '#000',
    font: { color: '#aaa', size: 10 }, showlegend: false,
    margin: { l: 0, r: 0, t: 5, b: 5 },
  };
}

function getCamera(){
  try{const p=document.getElementById('plot3d');if(p&&p._fullLayout&&p._fullLayout.scene)return p._fullLayout.scene._scene.getCamera();}catch(e){}
  return null;
}

// ── Full rebuild ──
function rebuildPlot() {
  const cam = getCamera();
  const traces = buildAllTraces();

  // Pre-populate contour loops + PAB data into the traces BEFORE plotting
  const mesh = getMesh(currentSubdiv);
  const pab = T.pab_body[currentEpoch];
  const targetFlux = computeFlux(pab, activeGroups);
  const loops = extractContourLoops(mesh, surfaceResult.fluxArr, targetFlux,
    surfaceResult.mMin, surfaceResult.mMax, surfaceResult.span);
  const pabPos = pabToSurface(pab);
  const activeIdx = findClosestLoop(loops, pabPos);
  const activeLoop = activeIdx >= 0 ? loopToXYZ(loops[activeIdx]) : {x:[],y:[],z:[]};
  const inactiveLoops = loops.filter((_, i) => i !== activeIdx);
  const inactive = loopsToXYZ(inactiveLoops);

  traces[TRACE.contourActive].x = activeLoop.x;
  traces[TRACE.contourActive].y = activeLoop.y;
  traces[TRACE.contourActive].z = activeLoop.z;
  traces[TRACE.contourInactive].x = inactive.x;
  traces[TRACE.contourInactive].y = inactive.y;
  traces[TRACE.contourInactive].z = inactive.z;
  traces[TRACE.pabDot].x = [pabPos[0]];
  traces[TRACE.pabDot].y = [pabPos[1]];
  traces[TRACE.pabDot].z = [pabPos[2]];
  traces[TRACE.pabDot].text = [`${currentEpoch}`];

  const layout = build3DLayout();
  if (cam) layout.scene.camera = cam;
  // purge + newPlot to handle mesh topology changes across subdivision levels
  Plotly.purge('plot3d');
  Plotly.newPlot('plot3d', traces, layout, { responsive: true, displayModeBar: false }).then(() => {
    applyNormalsVisibility();
    updateInfoText();
  });
}

// ── Normals visibility ──
function applyNormalsVisibility(){
  const show=document.getElementById('normals-check').checked;
  const idx=[];for(let i=0;i<TRACE.normalCount;i++)idx.push(TRACE.normalStart+i);
  if(idx.length>0)Plotly.restyle('plot3d',{visible:show},idx);
}
function toggleNormals(){applyNormalsVisibility();}

// ── Articulation sliders ──
function stepEpoch(delta) {
  currentEpoch = Math.max(0, Math.min(T.n_obs - 1, currentEpoch + delta));
  document.getElementById('epoch-slider').value = currentEpoch;
  updateEpoch();
}

function stepArt(si, delta) {
  const s=D.sliders[si], id='art-'+si;
  const el=document.getElementById(id);
  const v=Math.max(s.range[0], Math.min(s.range[1], +el.value + delta * s.step));
  el.value=v;
  document.getElementById(id+'-val').textContent=v+'\u00b0';
  for(const cn of s.components)sliderAngles[cn]=v;
  rebuildPlot();
}

// Default overrides per slider label
const SLIDER_DEFAULTS = {'Antenna Dishes': 15};

function buildSliderUI(){
  const c=document.getElementById('art-sliders');let h='';
  for(let si=0;si<D.sliders.length;si++){
    const s=D.sliders[si],id='art-'+si;
    const def = SLIDER_DEFAULTS[s.label] !== undefined ? SLIDER_DEFAULTS[s.label] : s.default;
    h+='<div class="ctrl-group"><span class="ctrl-label">'+s.label+':</span>';
    h+='<button class="btn" onclick="stepArt('+si+',-1)">\u2212</button>';
    h+='<input type="range" id="'+id+'" min="'+s.range[0]+'" max="'+s.range[1]+'" value="'+def+'" step="'+s.step+'" style="width:80px">';
    h+='<button class="btn" onclick="stepArt('+si+',1)">+</button>';
    h+='<span class="ctrl-val" id="'+id+'-val">'+def+'\u00b0</span></div>';
  }
  c.innerHTML=h;
  for(let si=0;si<D.sliders.length;si++){
    const s=D.sliders[si],id='art-'+si;
    // Apply default override to sliderAngles
    const def = SLIDER_DEFAULTS[s.label] !== undefined ? SLIDER_DEFAULTS[s.label] : s.default;
    for(const cn of s.components)sliderAngles[cn]=def;
    document.getElementById(id).oninput=function(){
      const v=+this.value;document.getElementById(id+'-val').textContent=v+'\u00b0';
      for(const cn of s.components)sliderAngles[cn]=v;
      rebuildPlot();
    };
  }
}

// ── Playback ──
function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('play-btn');
  if (playing) {
    btn.textContent = '⏸ Pause';
    btn.classList.add('active');
    const speed = +document.getElementById('speed-select').value;
    playTimer = setInterval(() => {
      currentEpoch = (currentEpoch + 1) % T.n_obs;
      document.getElementById('epoch-slider').value = currentEpoch;
      updateEpoch();
    }, speed);
  } else {
    btn.textContent = '▶ Play';
    btn.classList.remove('active');
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
  }
}

// ── Keyboard ──
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight') {
    currentEpoch = Math.min(currentEpoch + 1, T.n_obs - 1);
    document.getElementById('epoch-slider').value = currentEpoch;
    updateEpoch();
  }
  else if (e.code === 'ArrowLeft') {
    currentEpoch = Math.max(currentEpoch - 1, 0);
    document.getElementById('epoch-slider').value = currentEpoch;
    updateEpoch();
  }
  else if (e.code === 'KeyN') {
    const cb = document.getElementById('normals-check'); cb.checked = !cb.checked; toggleNormals();
  }
  else if (e.code === 'KeyT') {
    const cb = document.getElementById('trail-check'); cb.checked = !cb.checked; updateEpoch();
  }
});

// ── Epoch slider ──
document.getElementById('epoch-slider').oninput = function() {
  currentEpoch = +this.value;
  updateEpoch();
};
document.getElementById('epoch-slider').max = T.n_obs - 1;

// ── Init ──
document.getElementById('title').textContent = D.title;
buildSliderUI();

// Capture reference range
{const g=buildActiveGroups(),m=getMesh(currentSubdiv),r=computeSurface(m,g);refRange={logMin:r.logMin,logMax:r.logMax};}

rebuildPlot();
buildLCPlot();

// IPL plots use precomputed data — build immediately
buildIPLPlot();
buildAngPlot();

document.getElementById('subdiv-select').onchange=function(){
  currentSubdiv=+this.value;
  rebuildPlot();
};
