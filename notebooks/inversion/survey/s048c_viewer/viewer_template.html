<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C_t Cloud Evolution Viewer</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000; color: #ccc; font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #header {
    height: 32px; padding: 0 16px; background: #0a0a0a;
    border-bottom: 1px solid #222;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  #header h1 { font-size: 13px; color: #ddd; font-weight: 500; }
  #info-text { font-size: 11px; color: #888; }
  #main { flex: 1; display: flex; min-height: 0; }
  #plot3d { flex: 2; min-height: 0; min-width: 0; }
  #sidebar {
    flex: 1; min-width: 600px; max-width: 820px;
    display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid #222;
  }
  #sidebar-top {
    display: flex; flex-direction: row;
    flex: 0 0 320px;
    border-bottom: 1px solid #222;
  }
  #plot-sat, #plot-omega-dir {
    flex: 1; min-width: 0; min-height: 0;
  }
  #plot-sat { border-right: 1px solid #222; }
  .sub-title {
    position: absolute; top: 6px; left: 8px;
    font-size: 10px; color: #666; letter-spacing: 0.5px; pointer-events: none;
    z-index: 10;
  }
  .sub-wrap { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; }
  .sub-wrap > div { flex: 1; min-width: 0; min-height: 0; }
  #omega-mag-plot {
    flex: 0 0 110px;
    border-bottom: 1px solid #222;
  }
  #lc-plot { flex: 1; min-height: 180px; }
  #readouts {
    background: #0a0a0a; border-top: 1px solid #222; padding: 10px 14px;
    font-size: 12px; line-height: 1.6;
    flex-shrink: 0;
  }
  .readout-row { display: flex; justify-content: space-between; }
  .readout-row .label { color: #888; }
  .readout-row .val { color: #ddd; font-variant-numeric: tabular-nums; }
  .readout-row .val.green { color: #2ecc71; }
  .readout-row .val.yellow { color: #f1c40f; }
  .readout-row .val.blue { color: #5dade2; }
  .readout-row .val.pink { color: #e91e63; }
  hr.sep { border: none; border-top: 1px solid #222; margin: 6px 0; }
  #controls {
    background: #0a0a0a; border-top: 1px solid #222;
    display: flex; align-items: center; padding: 6px 12px; gap: 8px;
    flex-wrap: wrap; flex-shrink: 0;
  }
  .ctrl-group { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .ctrl-label { font-size: 11px; color: #999; }
  .ctrl-val { font-size: 11px; color: #5dade2; min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  .ctrl-group input[type=range] { accent-color: #5dade2; cursor: pointer; }
  .ctrl-group select, .ctrl-group input[type=number] {
    background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 3px;
    padding: 2px 6px; font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .ctrl-group input[type=number] { width: 60px; cursor: text; }
  .ctrl-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #999; cursor: pointer; }
  .ctrl-toggle input { accent-color: #5dade2; cursor: pointer; }
  .sep-v { width: 1px; height: 20px; background: #333; flex-shrink: 0; }
  .btn {
    background: #1a1a1a; color: #ccc; border: 1px solid #444; border-radius: 3px;
    padding: 2px 10px; font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: #2a2a2a; }
  .btn.active { background: #1a3a5a; border-color: #5dade2; color: #5dade2; }
  .kbd { font-size: 10px; color: #555; }
</style>
</head>
<body>

<div id="header">
  <h1 id="title"></h1>
  <span id="info-text"></span>
</div>
<div id="main">
  <div id="plot3d"></div>
  <div id="sidebar">
    <div id="sidebar-top">
      <div class="sub-wrap">
        <span class="sub-title">satellite (inertial frame)</span>
        <div id="plot-sat"></div>
      </div>
      <div class="sub-wrap">
        <span class="sub-title">ω-axis (body-frame sphere)</span>
        <div id="plot-omega-dir"></div>
      </div>
    </div>
    <div id="omega-mag-plot"></div>
    <div id="lc-plot"></div>
    <div id="readouts"></div>
  </div>
</div>
<div id="controls">
  <button class="btn" id="play-btn" onclick="togglePlay()">&#9654; Play</button>
  <div class="ctrl-group">
    <span class="ctrl-label">Frame:</span>
    <button class="btn" onclick="stepFrame(-1)">&minus;</button>
    <input type="range" id="frame-slider" min="0" max="0" value="0" step="1" style="width:240px">
    <button class="btn" onclick="stepFrame(1)">+</button>
    <span class="ctrl-val" id="frame-val">0</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Epoch:</span>
    <input type="number" id="epoch-input" min="0" step="1" value="0">
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Speed:</span>
    <select id="speed-select">
      <option value="200">Slow</option>
      <option value="80" selected>Normal</option>
      <option value="30">Fast</option>
      <option value="15">Very Fast</option>
    </select>
  </div>
  <div class="sep-v"></div>
  <label class="ctrl-toggle">
    <input type="checkbox" id="trail-check" checked onchange="updateFrame()"> Trail
  </label>
  <label class="ctrl-toggle">
    <input type="checkbox" id="haze-check" checked onchange="toggleHaze()"> Haze
  </label>
  <div class="sep-v"></div>
  <span class="kbd">Space: play &middot; &larr;&rarr;: step &middot; T: trail &middot; H: haze</span>
</div>

<script>
const D = __PAYLOAD__;
const PI = Math.PI;
const TRAIL_LEN = 30;

// ── base64 → typed-array decoders ──
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function b64ToInt16(b64) {
  const bytes = b64ToBytes(b64);
  return new Int16Array(bytes.buffer, bytes.byteOffset, bytes.byteLength / 2);
}
function b64ToUint16(b64) {
  const bytes = b64ToBytes(b64);
  return new Uint16Array(bytes.buffer, bytes.byteOffset, bytes.byteLength / 2);
}
function b64ToUint32(b64) {
  const bytes = b64ToBytes(b64);
  return new Uint32Array(bytes.buffer, bytes.byteOffset, bytes.byteLength / 4);
}
function b64DequantUnit(b64) {
  const i16 = b64ToInt16(b64);
  const out = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) out[i] = i16[i] / 32767;
  return out;
}
function b64DequantRange(b64, halfRange) {
  const i16 = b64ToInt16(b64);
  const out = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) out[i] = (i16[i] / 32767) * halfRange;
  return out;
}

// ── rotvec_pool: int16 quantized over [-π, π] ──
const ROTVEC_I16 = b64ToInt16(D.rotvec_pool_i16_b64);
const N_SAMPLES = ROTVEC_I16.length / 3;
const ROTVEC = new Float32Array(ROTVEC_I16.length);
for (let i = 0; i < ROTVEC_I16.length; i++) {
  ROTVEC[i] = (ROTVEC_I16[i] / 32767) * PI;
}
const HAZE_IDX = b64ToUint32(D.haze_indices_u32_b64);
const SURV_IDX = b64ToUint32(D.survivor_indices_u32_b64);
const SURV_OFF = D.survivor_offsets;
const N_FRAMES = D.n_epochs;

// ── per-frame predicted-mag arrays (uint8 quantized over [cmin, cmax]) ──
const HAZE_MAGS_U8 = b64ToBytes(D.haze_mags_u8_b64);
const SURV_MAGS_U8 = b64ToBytes(D.survivor_mags_u8_b64);
const HAZE_N = HAZE_IDX.length;
const MAG_CMIN = D.mag_cmin, MAG_CMAX = D.mag_cmax;
const MAG_SPAN = (MAG_CMAX - MAG_CMIN) || 1;
// Custom colorscale: red (bright, low mag) → purple → blue (dim, high mag).
// Deliberately avoids green and yellow so truth (#2ecc71) and closest
// (#f1c40f) stay distinct.
const MAG_COLORSCALE = [
  [0.00, '#ff3030'],  // brightest (low mag) = red
  [0.50, '#9b59b6'],  // mid = purple
  [1.00, '#3060ff'],  // dimmest (high mag) = blue
];

function dequantMag(u8) { return MAG_CMIN + (u8 / 255) * MAG_SPAN; }
function hazeMags(f) {
  const out = new Float32Array(HAZE_N);
  const off = f * HAZE_N;
  for (let i = 0; i < HAZE_N; i++) out[i] = dequantMag(HAZE_MAGS_U8[off + i]);
  return out;
}
function survivorMags(f) {
  const start = SURV_OFF[f], end = SURV_OFF[f + 1];
  const out = new Float32Array(end - start);
  for (let i = 0; i < end - start; i++) out[i] = dequantMag(SURV_MAGS_U8[start + i]);
  return out;
}

// ── haze x/y/z arrays (built once, never restyled) ──
const HAZE_X = new Float32Array(HAZE_IDX.length);
const HAZE_Y = new Float32Array(HAZE_IDX.length);
const HAZE_Z = new Float32Array(HAZE_IDX.length);
for (let i = 0; i < HAZE_IDX.length; i++) {
  const j = HAZE_IDX[i] * 3;
  HAZE_X[i] = ROTVEC[j];
  HAZE_Y[i] = ROTVEC[j + 1];
  HAZE_Z[i] = ROTVEC[j + 2];
}

// ── helper: extract survivors at frame f, anchored to (unwrapped) truth ──
//
// The canonical rotvec chart `|r| ≤ π` has a discontinuity on the boundary
// sphere. For each survivor at this frame, we pick whichever of
//     r_canonical    (from the pool, |r| ≤ π)
//     r_alt = (1 − 2π/|r|)·r    (|r_alt| ∈ [π, 2π], opposite direction)
// is closer in 3D to truth_rotvec[f]. This eliminates the wrap-around
// discontinuity for the cluster around truth — the cloud stays glued to
// truth as truth's own rotvec walks past the boundary into the outer shell.
const TWO_PI = 2 * PI;

function survivorXYZ(f) {
  const truth = D.truth_rotvec_per_epoch[f];
  const tx = truth[0], ty = truth[1], tz = truth[2];
  const start = SURV_OFF[f], end = SURV_OFF[f + 1];
  const n = end - start;
  const x = new Float32Array(n), y = new Float32Array(n), z = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const j = SURV_IDX[start + i] * 3;
    const rx = ROTVEC[j], ry = ROTVEC[j + 1], rz = ROTVEC[j + 2];
    const norm = Math.sqrt(rx * rx + ry * ry + rz * rz);
    if (norm < 1e-10) { x[i] = rx; y[i] = ry; z[i] = rz; continue; }
    const fac = 1.0 - TWO_PI / norm;
    const ax = fac * rx, ay = fac * ry, az = fac * rz;
    const dxC = rx - tx, dyC = ry - ty, dzC = rz - tz;
    const dxA = ax - tx, dyA = ay - ty, dzA = az - tz;
    const dCan = dxC * dxC + dyC * dyC + dzC * dzC;
    const dAlt = dxA * dxA + dyA * dyA + dzA * dzA;
    if (dAlt < dCan) { x[i] = ax; y[i] = ay; z[i] = az; }
    else             { x[i] = rx; y[i] = ry; z[i] = rz; }
  }
  return [x, y, z];
}

// ── trace indices ──
const T_HAZE = 0, T_SURV = 1, T_TRUTH = 2, T_CLOSE = 3, T_LINE = 4, T_TRAIL = 5;

// ── header ──
document.getElementById('title').textContent =
  `C_t cloud — seed ${D.seed}, ${D.surrogate}, n=${D.n_samples.toLocaleString()}, tol=${D.tolerance_mag.toFixed(2)} mag`;
document.getElementById('info-text').textContent =
  `|ω|=${D.omega_mag_dps.toFixed(3)} dps · ${D.n_epochs} frame${D.n_epochs===1?'':'s'} (${D.epoch_spec_str ?? 'specific'}) · cfg ${D.config_id}`;

// ── 3D plot init ──
const initialHazeMags = hazeMags(0);
const traces = [
  { type: 'scatter3d', mode: 'markers',
    x: Array.from(HAZE_X), y: Array.from(HAZE_Y), z: Array.from(HAZE_Z),
    marker: {
      size: 1.5,
      color: Array.from(initialHazeMags),
      colorscale: MAG_COLORSCALE,
      cmin: MAG_CMIN, cmax: MAG_CMAX,
      opacity: 0.18,
      showscale: false,
    },
    name: 'killed', hoverinfo: 'skip', showlegend: true },
  { type: 'scatter3d', mode: 'markers', x: [], y: [], z: [],
    marker: {
      size: 3.5,
      color: [],
      colorscale: MAG_COLORSCALE,
      cmin: MAG_CMIN, cmax: MAG_CMAX,
      opacity: 0.95,
      showscale: true,
      colorbar: {
        title: { text: 'predicted<br>mag', font: { color: '#aaa', size: 10 } },
        tickfont: { color: '#aaa', size: 9 },
        thickness: 10, len: 0.45, x: 0.97, y: 0.55,
        bgcolor: 'rgba(10,10,10,0.6)', bordercolor: '#222', borderwidth: 1,
      },
    },
    name: 'survivors', hoverinfo: 'skip', showlegend: true },
  { type: 'scatter3d', mode: 'markers', x: [], y: [], z: [],
    marker: { size: 9, color: '#2ecc71', symbol: 'diamond',
              line: { color: '#000', width: 1 } },
    name: 'truth-q', hoverinfo: 'skip', showlegend: true },
  { type: 'scatter3d', mode: 'markers', x: [], y: [], z: [],
    marker: { size: 9, color: '#f1c40f', symbol: 'circle',
              line: { color: '#000', width: 1 } },
    name: 'closest', hoverinfo: 'skip', showlegend: true },
  { type: 'scatter3d', mode: 'lines', x: [], y: [], z: [],
    line: { color: '#f1c40f', width: 4 },
    name: 'truth↔closest', hoverinfo: 'skip', showlegend: false },
  { type: 'scatter3d', mode: 'lines', x: [], y: [], z: [],
    line: { color: '#27ae60', width: 2 },
    name: 'truth trail', opacity: 0.5, hoverinfo: 'skip', showlegend: false },
];

const layout3d = {
  paper_bgcolor: '#000', plot_bgcolor: '#000',
  scene: {
    xaxis: { range: [-2 * PI, 2 * PI], color: '#444', gridcolor: '#1a1a1a',
             backgroundcolor: '#000', showbackground: true,
             title: { text: 'rotvec x', font: { color: '#666', size: 11 } } },
    yaxis: { range: [-2 * PI, 2 * PI], color: '#444', gridcolor: '#1a1a1a',
             backgroundcolor: '#000', showbackground: true,
             title: { text: 'rotvec y', font: { color: '#666', size: 11 } } },
    zaxis: { range: [-2 * PI, 2 * PI], color: '#444', gridcolor: '#1a1a1a',
             backgroundcolor: '#000', showbackground: true,
             title: { text: 'rotvec z', font: { color: '#666', size: 11 } } },
    camera: { eye: { x: 1.6, y: 1.6, z: 1.0 } },
    aspectmode: 'cube',
  },
  showlegend: true,
  legend: { font: { color: '#bbb', size: 11 }, bgcolor: 'rgba(10,10,10,0.7)' },
  margin: { l: 0, r: 0, t: 0, b: 0 },
};

Plotly.newPlot('plot3d', traces, layout3d,
               { displaylogo: false, responsive: true });

// ────────────────────────────────────────────────────────────────────
// SATELLITE MINI 3D — articulated rest-frame mesh, rotated by R(q[t])
// in the inertial frame. Sun + observer arrows shown in inertial frame.
// Body axes (X/Y/Z) tumble with the body.
// ────────────────────────────────────────────────────────────────────

const MESH_VERTS_FLAT = b64DequantRange(D.mesh_verts_i16_b64, D.mesh_bbox_half);
const MESH_NV = D.mesh_verts_n;
const MESH_X_BODY = new Float32Array(MESH_NV);
const MESH_Y_BODY = new Float32Array(MESH_NV);
const MESH_Z_BODY = new Float32Array(MESH_NV);
for (let i = 0; i < MESH_NV; i++) {
  MESH_X_BODY[i] = MESH_VERTS_FLAT[i * 3];
  MESH_Y_BODY[i] = MESH_VERTS_FLAT[i * 3 + 1];
  MESH_Z_BODY[i] = MESH_VERTS_FLAT[i * 3 + 2];
}
const MESH_FACES_U16 = b64ToUint16(D.mesh_faces_u16_b64);
const MESH_NF = D.mesh_faces_n;
const MESH_I = new Uint16Array(MESH_NF);
const MESH_J = new Uint16Array(MESH_NF);
const MESH_K = new Uint16Array(MESH_NF);
for (let f = 0; f < MESH_NF; f++) {
  MESH_I[f] = MESH_FACES_U16[f * 3];
  MESH_J[f] = MESH_FACES_U16[f * 3 + 1];
  MESH_K[f] = MESH_FACES_U16[f * 3 + 2];
}
const FACE_COMP_ID = b64ToBytes(D.face_comp_id_u8_b64);

// Component colors: must align with D.component_order, which render.py
// emits as ['Bus', 'SP_North', 'SP_South', 'AD_East', 'AD_West'].
const COMPONENT_COLORS = [
  '#bbbbbb',  // Bus — light gray
  '#4a7fb5',  // SP_North — steel blue
  '#4a7fb5',  // SP_South — steel blue
  '#a06a3a',  // AD_East — bronze
  '#a06a3a',  // AD_West — bronze
];
const FACE_COLORS = new Array(MESH_NF);
for (let f = 0; f < MESH_NF; f++) FACE_COLORS[f] = COMPONENT_COLORS[FACE_COMP_ID[f]];

// Body-frame mesh extent — used to scale a copy of the satellite into
// the ω-direction unit sphere (where it sits at half-radius as a
// reference body for the precession trail).
let _MESH_MAX_R = 0;
for (let i = 0; i < MESH_NV; i++) {
  const r = Math.sqrt(
    MESH_X_BODY[i] * MESH_X_BODY[i] +
    MESH_Y_BODY[i] * MESH_Y_BODY[i] +
    MESH_Z_BODY[i] * MESH_Z_BODY[i]
  );
  if (r > _MESH_MAX_R) _MESH_MAX_R = r;
}
// Half the sphere's unit radius — fits the mesh inside, leaves clearance
// to the shell where ω̂ lives.
const SPHERE_SAT_SCALE = 0.5 / _MESH_MAX_R;
const SPHERE_SAT_X = new Float32Array(MESH_NV);
const SPHERE_SAT_Y = new Float32Array(MESH_NV);
const SPHERE_SAT_Z = new Float32Array(MESH_NV);
for (let i = 0; i < MESH_NV; i++) {
  SPHERE_SAT_X[i] = MESH_X_BODY[i] * SPHERE_SAT_SCALE;
  SPHERE_SAT_Y[i] = MESH_Y_BODY[i] * SPHERE_SAT_SCALE;
  SPHERE_SAT_Z[i] = MESH_Z_BODY[i] * SPHERE_SAT_SCALE;
}

// Quaternions per sampled epoch (n_ep × 4) — wxyz, canonicalized w >= 0.
const QUATS_AT = b64DequantUnit(D.quaternions_at_i16_b64);
// Sun / observer unit vectors per sampled epoch (inertial frame).
const SUN_AT = b64DequantUnit(D.sun_unit_at_i16_b64);
const OBS_AT = b64DequantUnit(D.obs_unit_at_i16_b64);

// Quaternion (w,x,y,z) → 3×3 rotation matrix as length-9 row-major array.
// Returned R rotates body-frame vectors into inertial: v_i = R · v_b.
function quatToMat(qw, qx, qy, qz) {
  const w2 = qw * qw, x2 = qx * qx, y2 = qy * qy, z2 = qz * qz;
  const wx = qw * qx, wy = qw * qy, wz = qw * qz;
  const xy = qx * qy, xz = qx * qz, yz = qy * qz;
  return [
    w2 + x2 - y2 - z2, 2 * (xy - wz),     2 * (xz + wy),
    2 * (xy + wz),     w2 - x2 + y2 - z2, 2 * (yz - wx),
    2 * (xz - wy),     2 * (yz + wx),     w2 - x2 - y2 + z2,
  ];
}

// Body-axis half-length in inertial frame (must match satellite scale).
// IS-901 reaches ~15.5 m; axes ~12 m make them visible without dominating.
const BODY_AXIS_LEN = 12.0;

// Sun/observer arrow length in inertial frame (slightly longer than body
// axes so they read as "pointing inward" toward the satellite).
const ARROW_LEN = 18.0;

const satTraces = [
  // 0: mesh3d satellite (rotated per frame)
  {
    type: 'mesh3d',
    x: Array.from(MESH_X_BODY), y: Array.from(MESH_Y_BODY), z: Array.from(MESH_Z_BODY),
    i: Array.from(MESH_I), j: Array.from(MESH_J), k: Array.from(MESH_K),
    facecolor: FACE_COLORS,
    flatshading: true,
    lighting: { ambient: 0.55, diffuse: 0.9, specular: 0.2, roughness: 0.6 },
    lightposition: { x: 100, y: 100, z: 100 },
    name: 'satellite', hoverinfo: 'skip', showlegend: false, showscale: false,
  },
  // 1: body X axis (red)
  { type: 'scatter3d', mode: 'lines', x: [], y: [], z: [],
    line: { color: '#e74c3c', width: 4 }, name: 'X_b', hoverinfo: 'skip', showlegend: false },
  // 2: body Y axis (green)
  { type: 'scatter3d', mode: 'lines', x: [], y: [], z: [],
    line: { color: '#2ecc71', width: 4 }, name: 'Y_b', hoverinfo: 'skip', showlegend: false },
  // 3: body Z axis (blue)
  { type: 'scatter3d', mode: 'lines', x: [], y: [], z: [],
    line: { color: '#3498db', width: 4 }, name: 'Z_b', hoverinfo: 'skip', showlegend: false },
  // 4: sun arrow (gold)
  { type: 'scatter3d', mode: 'lines', x: [], y: [], z: [],
    line: { color: '#f39c12', width: 6 }, name: 'sun', hoverinfo: 'skip', showlegend: false },
  // 5: sun marker (gold dot at far end)
  { type: 'scatter3d', mode: 'markers', x: [], y: [], z: [],
    marker: { size: 6, color: '#f39c12', symbol: 'diamond' },
    name: 'sun_dot', hoverinfo: 'skip', showlegend: false },
  // 6: observer arrow (cyan)
  { type: 'scatter3d', mode: 'lines', x: [], y: [], z: [],
    line: { color: '#76b6c4', width: 6 }, name: 'observer', hoverinfo: 'skip', showlegend: false },
  // 7: observer marker
  { type: 'scatter3d', mode: 'markers', x: [], y: [], z: [],
    marker: { size: 6, color: '#76b6c4', symbol: 'circle' },
    name: 'obs_dot', hoverinfo: 'skip', showlegend: false },
];

// Initial camera baked along observer's POV at frame 0.
const SAT_AXIS_RANGE = [-22, 22];

const camDist = 2.4;

// ────────────────────────────────────────────────────────────────────
// ω-DIRECTION SPHERE — body-frame unit sphere, ω̂(t) as a moving point
// with a fading trail. Static wireframe + body axes for reference.
// ────────────────────────────────────────────────────────────────────

const OMEGA_DIR_FULL = b64DequantUnit(D.omega_dir_full_i16_b64);  // (n_obs * 3,)
const OMEGA_MAG_DPS_FULL = D.omega_mag_dps_full;                  // length n_obs

// Great-circle rings on principal planes.
function greatCircle(plane, n) {
  const x = new Float32Array(n + 1), y = new Float32Array(n + 1), z = new Float32Array(n + 1);
  for (let i = 0; i <= n; i++) {
    const t = (i / n) * 2 * PI;
    const c = Math.cos(t), s = Math.sin(t);
    if (plane === 'XY') { x[i] = c; y[i] = s; z[i] = 0; }
    else if (plane === 'XZ') { x[i] = c; y[i] = 0; z[i] = s; }
    else { x[i] = 0; y[i] = c; z[i] = s; }
  }
  return [x, y, z];
}
const [gxXY, gyXY, gzXY] = greatCircle('XY', 64);
const [gxXZ, gyXZ, gzXZ] = greatCircle('XZ', 64);
const [gxYZ, gyYZ, gzYZ] = greatCircle('YZ', 64);

const omegaDirTraces = [
  // 0: XY ring
  { type: 'scatter3d', mode: 'lines', x: Array.from(gxXY), y: Array.from(gyXY), z: Array.from(gzXY),

  // 1: XZ ring
  { type: 'scatter3d', mode: 'lines', x: Array.from(gxXZ), y: Array.from(gyXZ), z: Array.from(gzXZ),
    line: { color: '#333', width: 1 }, hoverinfo: 'skip', showlegend: false },
  // 2: YZ ring
  { type: 'scatter3d', mode: 'lines', x: Array.from(gxYZ), y: Array.from(gyYZ), z: Array.from(gzYZ),
    line: { color: '#333', width: 1 }, hoverinfo: 'skip', showlegend: false },
  // 3: body X axis (red, ±1)
  { type: 'scatter3d', mode: 'lines', x: [-1, 1], y: [0, 0], z: [0, 0],
    line: { color: '#e74c3c', width: 2 }, hoverinfo: 'skip', showlegend: false },
  // 4: body Y axis (green)
  { type: 'scatter3d', mode: 'lines', x: [0, 0], y: [-1, 1], z: [0, 0],
    line: { color: '#2ecc71', width: 2 }, hoverinfo: 'skip', showlegend: false },

  { type: 'scatter3d', mode: 'lines', x: [0, 0], y: [0, 0], z: [-1, 1],
    line: { color: '#3498db', width: 2 }, hoverinfo: 'skip', showlegend: false },
  // 6: ω-direction trail (permanent — every sampled frame from start to current)
  { type: 'scatter3d', mode: 'lines', x: [], y: [], z: [],
    line: { color: '#e91e63', width: 3 }, opacity: 0.7,
    hoverinfo: 'skip', showlegend: false },
  // 7: ω-direction current point (bright pink)
  { type: 'scatter3d', mode: 'markers', x: [], y: [], z: [],
    marker: { size: 8, color: '#e91e63', symbol: 'diamond',
              line: { color: '#000', width: 1 } },
    hoverinfo: 'skip', showlegend: false },
  // 8: satellite mesh inside the sphere (body frame, static, half-radius).

  // relative to the satellite directly. Never restyled.
  { type: 'mesh3d',
    x: Array.from(SPHERE_SAT_X), y: Array.from(SPHERE_SAT_Y), z: Array.from(SPHERE_SAT_Z),
    i: Array.from(MESH_I), j: Array.from(MESH_J), k: Array.from(MESH_K),

];

const T_SAT_MESH = 0, T_SAT_BX = 1, T_SAT_BY = 2, T_SAT_BZ = 3,

const omegaDirLayout = {

  scene: {

             backgroundcolor: '#000', showbackground: false,
             showticklabels: false, title: { text: '' }, showspikes: false },
    yaxis: { range: [-1.3, 1.3], color: '#222', gridcolor: '#101010',

    zaxis: { range: [-1.3, 1.3], color: '#222', gridcolor: '#101010',

    camera: { eye: { x: 1.05, y: 1.05, z: 0.8 }, up: { x: 0, y: 0, z: 1 } },

};
Plotly.newPlot('plot-omega-dir', omegaDirTraces, omegaDirLayout,

// ────────────────────────────────────────────────────────────────────

const epAxis = D.epoch_indices;
const allEp = Array.from({length: D.n_obs}, (_, i) => i);
const omegaStripTraces = [

const omegaStripLayout = {

Plotly.newPlot('omega-mag-plot', omegaStripTraces, omegaStripLayout,

document.getElementById('omega-mag-plot').on('plotly_click', (ev) => {

// ── LC plot init ──
const lcVals = epAxis.map(e => D.mag_hifi_full[e]);

// ── readouts ──
function setReadouts(f) {
  const ep = epAxis[f];
  const om = OMEGA_MAG_DPS_FULL[ep];
  const od = [
    OMEGA_DIR_FULL[ep * 3], OMEGA_DIR_FULL[ep * 3 + 1], OMEGA_DIR_FULL[ep * 3 + 2],
  ];
  document.getElementById('readouts').innerHTML = `
    <div class="readout-row"><span class="label">epoch idx</span>
      <span class="val">${ep} / ${D.n_obs - 1}</span></div>
    <div class="readout-row"><span class="label">frame</span>
      <span class="val">${f + 1} / ${N_FRAMES}</span></div>
    <hr class="sep">
    <div class="readout-row"><span class="label">measured mag</span>
      <span class="val">${D.measured_at[f].toFixed(3)}</span></div>
    <div class="readout-row"><span class="label">|C_t| (survivors)</span>
      <span class="val blue">${D.n_survivors_per_epoch[f].toLocaleString()}</span></div>
    <div class="readout-row"><span class="label">closest-to-truth</span>
      <span class="val yellow">${D.closest_deg_per_epoch[f].toFixed(2)}°</span></div>
    <hr class="sep">
    <div class="readout-row"><span class="label">|ω|(t)</span>
      <span class="val pink">${om.toFixed(4)} dps</span></div>
    <div class="readout-row"><span class="label">ω̂_body</span>
      <span class="val pink">[${od[0].toFixed(2)}, ${od[1].toFixed(2)}, ${od[2].toFixed(2)}]</span></div>
    <hr class="sep">
    <div class="readout-row"><span class="label">N</span>
      <span class="val">${D.n_samples.toLocaleString()}</span></div>
    <div class="readout-row"><span class="label">tolerance</span>
      <span class="val">${D.tolerance_mag.toFixed(2)} mag</span></div>
  `;
}

// ── frame update ──
let currentFrame = 0;

// Reusable scratch buffers for satellite mesh rotation (avoid GC pressure
// on the 80 ms frame cadence).
const SAT_X_INERTIAL = new Float32Array(MESH_NV);
const SAT_Y_INERTIAL = new Float32Array(MESH_NV);
const SAT_Z_INERTIAL = new Float32Array(MESH_NV);

function rotateSatMesh(R) {
  for (let i = 0; i < MESH_NV; i++) {
    const xb = MESH_X_BODY[i], yb = MESH_Y_BODY[i], zb = MESH_Z_BODY[i];
    SAT_X_INERTIAL[i] = R[0] * xb + R[1] * yb + R[2] * zb;
    SAT_Y_INERTIAL[i] = R[3] * xb + R[4] * yb + R[5] * zb;
    SAT_Z_INERTIAL[i] = R[6] * xb + R[7] * yb + R[8] * zb;
  }
}

function updateFrame() {
  const f = currentFrame;
  const [sx, sy, sz] = survivorXYZ(f);
  const t = D.truth_rotvec_per_epoch[f];
  const c = D.closest_pos_per_epoch[f];

  // trail
  let trailX = [], trailY = [], trailZ = [];
  if (document.getElementById('trail-check').checked) {
    const start = Math.max(0, f - TRAIL_LEN + 1);
    for (let k = start; k <= f; k++) {
      trailX.push(D.truth_rotvec_per_epoch[k][0]);
      trailY.push(D.truth_rotvec_per_epoch[k][1]);
      trailZ.push(D.truth_rotvec_per_epoch[k][2]);
    }
  }

  Plotly.restyle('plot3d', {
    x: [Array.from(sx), [t[0]], [c[0]], [t[0], c[0]], trailX],
    y: [Array.from(sy), [t[1]], [c[1]], [t[1], c[1]], trailY],
    z: [Array.from(sz), [t[2]], [c[2]], [t[2], c[2]], trailZ],
  }, [T_SURV, T_TRUTH, T_CLOSE, T_LINE, T_TRAIL]);

  Plotly.restyle('plot3d', {
    'marker.color': [Array.from(hazeMags(f)), Array.from(survivorMags(f))],
  }, [T_HAZE, T_SURV]);

  // ── satellite mini ───────────────────────────────────────────────
  const qw = QUATS_AT[f * 4], qx = QUATS_AT[f * 4 + 1],
        qy = QUATS_AT[f * 4 + 2], qz = QUATS_AT[f * 4 + 3];
  const R = quatToMat(qw, qx, qy, qz);
  rotateSatMesh(R);

  // body axes in inertial frame: R @ [L,0,0], R @ [0,L,0], R @ [0,0,L]
  const bxL = BODY_AXIS_LEN;
  const bx_x = R[0] * bxL, bx_y = R[3] * bxL, bx_z = R[6] * bxL;
  const by_x = R[1] * bxL, by_y = R[4] * bxL, by_z = R[7] * bxL;
  const bz_x = R[2] * bxL, bz_y = R[5] * bxL, bz_z = R[8] * bxL;

  const su = [SUN_AT[f * 3], SUN_AT[f * 3 + 1], SUN_AT[f * 3 + 2]];
  const ou = [OBS_AT[f * 3], OBS_AT[f * 3 + 1], OBS_AT[f * 3 + 2]];
  const sun_end = [su[0] * ARROW_LEN, su[1] * ARROW_LEN, su[2] * ARROW_LEN];
  const obs_end = [ou[0] * ARROW_LEN, ou[1] * ARROW_LEN, ou[2] * ARROW_LEN];

  Plotly.restyle('plot-sat', {
    x: [
      Array.from(SAT_X_INERTIAL),
      [0, bx_x], [0, by_x], [0, bz_x],
      [0, sun_end[0]], [sun_end[0]],
      [0, obs_end[0]], [obs_end[0]],
    ],
    y: [
      Array.from(SAT_Y_INERTIAL),
      [0, bx_y], [0, by_y], [0, bz_y],
      [0, sun_end[1]], [sun_end[1]],
      [0, obs_end[1]], [obs_end[1]],
    ],
    z: [
      Array.from(SAT_Z_INERTIAL),
      [0, bx_z], [0, by_z], [0, bz_z],
      [0, sun_end[2]], [sun_end[2]],
      [0, obs_end[2]], [obs_end[2]],
    ],
  }, [T_SAT_MESH, T_SAT_BX, T_SAT_BY, T_SAT_BZ,
      T_SAT_SUN_LINE, T_SAT_SUN_DOT, T_SAT_OBS_LINE, T_SAT_OBS_DOT]);

  // ── ω-direction sphere ───────────────────────────────────────────
  const ep = epAxis[f];
  const od_x = OMEGA_DIR_FULL[ep * 3];
  const od_y = OMEGA_DIR_FULL[ep * 3 + 1];
  const od_z = OMEGA_DIR_FULL[ep * 3 + 2];

  // Permanent ω̂ trail — every sampled frame from 0 up to current. Not
  // tied to the trail-check checkbox (which still controls the truth
  // trail in the cloud panel) and never truncated. Grows when scrubbing
  // forward, shrinks when scrubbing back.
  const odTrailX = new Array(f + 1);
  const odTrailY = new Array(f + 1);
  const odTrailZ = new Array(f + 1);
  for (let k = 0; k <= f; k++) {
    const e = epAxis[k];
    odTrailX[k] = OMEGA_DIR_FULL[e * 3];
    odTrailY[k] = OMEGA_DIR_FULL[e * 3 + 1];
    odTrailZ[k] = OMEGA_DIR_FULL[e * 3 + 2];
  }

  Plotly.restyle('plot-omega-dir', {
    x: [odTrailX, [od_x]],
    y: [odTrailY, [od_y]],
    z: [odTrailZ, [od_z]],
  }, [T_OD_TRAIL, T_OD_POINT]);

  // ── |ω|(t) cursor ────────────────────────────────────────────────
  Plotly.restyle('omega-mag-plot', {
    x: [[ep]], y: [[OMEGA_MAG_DPS_FULL[ep]]],
  }, [2]);

  // ── LC cursor ─────────────────────────────────────────────────────
  Plotly.restyle('lc-plot', {
    x: [[ep]], y: [[D.measured_at[f]]],
  }, [2]);

  document.getElementById('frame-slider').value = f;
  document.getElementById('frame-val').textContent = f;
  document.getElementById('epoch-input').value = ep;
  setReadouts(f);
}

function setFrame(f) {
  currentFrame = ((f % N_FRAMES) + N_FRAMES) % N_FRAMES;
  updateFrame();
}
function stepFrame(d) { setFrame(currentFrame + d); }

// ── play/pause ──
let playing = false, playTimer = null;
function togglePlay() {
  const btn = document.getElementById('play-btn');
  if (playing) {
    clearInterval(playTimer); playTimer = null; playing = false;
    btn.innerHTML = '&#9654; Play'; btn.classList.remove('active');
    return;
  }
  playing = true;
  btn.innerHTML = '&#10074;&#10074; Pause'; btn.classList.add('active');
  const speed = +document.getElementById('speed-select').value;
  playTimer = setInterval(() => {
    setFrame(currentFrame + 1);
  }, speed);
}

// ── haze toggle ──
function toggleHaze() {
  const on = document.getElementById('haze-check').checked;
  Plotly.restyle('plot3d', { visible: on }, [T_HAZE]);
}

// ── slider + epoch input ──
document.getElementById('frame-slider').max = N_FRAMES - 1;
document.getElementById('frame-slider').addEventListener('input', (e) => {
  setFrame(+e.target.value);
});
document.getElementById('epoch-input').max = D.n_obs - 1;
document.getElementById('epoch-input').addEventListener('change', (e) => {
  const ep = Math.max(0, Math.min(D.n_obs - 1, +e.target.value));
  let best = 0, bestD = Infinity;
  for (let f = 0; f < N_FRAMES; f++) {
    const dd = Math.abs(epAxis[f] - ep);
    if (dd < bestD) { bestD = dd; best = f; }
  }
  setFrame(best);
});
document.getElementById('speed-select').addEventListener('change', () => {
  if (playing) {
    clearInterval(playTimer);
    const speed = +document.getElementById('speed-select').value;
    playTimer = setInterval(() => setFrame(currentFrame + 1), speed);
  }
});

// ── keyboard ──
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); stepFrame(-1); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); stepFrame(1); }
  else if (e.key === 't' || e.key === 'T') {
    const cb = document.getElementById('trail-check');
    cb.checked = !cb.checked; updateFrame();
  }
  else if (e.key === 'h' || e.key === 'H') {
    const cb = document.getElementById('haze-check');
    cb.checked = !cb.checked; toggleHaze();
  }
});

// ── go ──
setFrame(0);
</script>
